# Ansible local configuration for the kamatera-medveris repository.
# This repository tracks infrastructure intent; not all roles referenced by
# playbooks are implemented yet. Use --syntax-check for what exists.

[defaults]
inventory = ansible/inventory/hosts.yml
roles_path = ansible/roles
collections_paths = .
deprecation_warnings = True
forks = 5
stdout_callback = yaml
retry_files_enabled = False

[privilege_escalation]
# Do not assume passwordless sudo in this repository.
# sudo/become is only appropriate for authenticated administrator sessions.
become = False
become_method = sudo
become_user = root

[ssh_connection]
# Matches the verified Kamatera SSH key path used for this project.
# References the key on the administering host; not bundled in the repo.
control_path_dir = ~/.ansible/cp
pipelining = True
