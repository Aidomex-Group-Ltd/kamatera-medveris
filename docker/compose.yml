# Medveris supporting services — Docker Compose release
# Target host: Kamatera VPS (medveris, 113.30.188.181)
# Deployment directory (VPS only, not in repo): /opt/medveris/compose
#
# Design notes:
#  - Ollama listens on 127.0.0.1:11434 only. It is not published to the network.
#  - n8n uses its own dedicated PostgreSQL container on a private Docker network.
#  - The native Kamatera PostgreSQL 18.6 cluster is NOT used by n8n.
#  - No port is published to 0.0.0.0 in this file.
#  - Image tags are pinned. See docs/DOCKER_DEPLOYMENT.md for update procedure.
#
# Vault/network reminders:
#  - UFW must remain SSH-only for inbound by default.
#  - Do not publish 5432, 11434, or 5678 without explicit approval.

x-resources: &service-limits
  deploy:
    resources:
      limits:
        cpus: "2.0"
        memory: 2G
      reservations:
        cpus: "0.25"
        memory: 256M

services:
  ollama:
    image: ollama/ollama:0.10.6
    container_name: medveris-ollama
    restart: unless-stopped
    # Bind only to localhost. Do not change this to 0.0.0.0.
    command: ["--listen", "127.0.0.1"]
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    environment:
      - OLLAMA_HOST=127.0.0.1
    <<: *service-limits
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 60s
      timeout: 20s
      start_period: 40s
      retries: 3
    networks:
      - medveris_internal
    # Ollama is private infrastructure for the VPS only.
    # Do not expose it publicly or add it to public reverse proxies here.

  n8n-postgres:
    image: postgres:16.6-alpine
    container_name: medveris-n8n-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${N8N_DB_USER}
      - POSTGRES_PASSWORD=${N8N_DB_PASSWORD}
      - POSTGRES_DB=${N8N_DB_NAME}
    volumes:
      - n8n_postgres_data:/var/lib/postgresql/data
    <<: *service-limits
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${N8N_DB_USER} -d ${N8N_DB_NAME} >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 5
    networks:
      - medveris_internal
    # This database is dedicated to n8n and is not reachable from outside Docker.

  n8n:
    image: n8nio/n8n:1.90.0
    container_name: medveris-n8n
    restart: unless-stopped
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=n8n-postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_USER=${N8N_DB_USER}
      - DB_POSTGRESDB_PASSWORD=${N8N_DB_PASSWORD}
      - DB_POSTGRESDB_DATABASE=${N8N_DB_NAME}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - N8N_HOST=${N8N_HOST:-n8n.internal}
      - N8N_PORT=5678
      - N8N_PROTOCOL=${N8N_PROTOCOL:-http}
      - WEBHOOK_URL=${WEBHOOK_URL:-http://n8n.internal:5678}
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE:-UTC}
    ports:
      # Private only. Do not change binding without approval.
      - "127.0.0.1:5678:5678"
    depends_on:
      n8n-postgres:
        condition: service_healthy
    <<: *service-limits
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:5678/health || exit 1"]
      interval: 20s
      timeout: 8s
      start_period: 30s
      retries: 5
    networks:
      - medveris_internal

networks:
  medveris_internal:
    name: medveris_internal
    driver: bridge

volumes:
  ollama_models:
    name: medveris_ollama_models
  n8n_postgres_data:
    name: medveris_n8n_postgres_data
