# Ansible Inventory for Medveris Kamatera Server
#
# STATUS: Phase 0 baseline verified 2026-11-07.
# - VPS at 113.30.188.181 is Ubuntu 26.04.1 LTS with PostgreSQL 18.6
# - deploy user has sudo but NOT passwordless sudo
# - UFW installed but NOT enabled
# - Fail2ban NOT installed
# - Docker, k3s, Helm, Nginx, Ollama, n8n NOT installed

# Kamatera supporting server
[production]
kamatera-1 ansible_host=113.30.188.181 ansible_user=deploy

# Global vars applied to all hosts
# NOTE: This section uses Ansible's key=value format (not YAML).
# NOTE: The working SSH key is ~/.ssh/medveris_kamatera, NOT id_ed25519.
# Verified 2026-11-07: medveris_kamatera authenticates; id_ed25519 also present.
[all:vars]
ansible_ssh_private_key_file=~/.ssh/medveris_kamatera
ansible_ssh_common_args='-o ServerAliveInterval=60 -o ServerAliveCountMax=3'

# PostgreSQL settings
# NOTE: PostgreSQL 18.6 is already installed and running.
# Do NOT reinstall or recreate the cluster.
# listen_addresses is commented out (defaults to localhost) — verified OK.
# password_encryption defaults to scram-sha-256 — verified OK.
# pg_hba.conf could not be read without sudo — needs sudo access to verify.
postgres_version="18"
postgres_data_dir="/var/lib/postgresql/18/main"
postgres_listen_addresses="localhost"
postgres_max_connections="100"
postgres_shared_buffers="128MB"
postgres_work_mem="16MB"
postgres_maintenance_work_mem="64MB"

# UFW firewall settings
# NOTE: UFW is installed (0.36.2) but NOT enabled.
# Enable only after validating rules with a second SSH session.
# Do NOT enable via Ansible without validation.
ufw_default_allow_ssh="yes"
ufw_allow_http="yes"
ufw_allow_https="yes"
ufw_deny_postgres="yes"
ufw_deny_ollama="yes"

# Resource constraints (8 GB RAM)
postgres_max_memory="1536m"
ollama_memory_limit="1024m"
n8n_memory_limit="512m"

# Cloudflare configuration
cloudflare_account_id="6337ed24a5f8ff4ec3f74517a55a7e6b"
r2_bucket_backups="medveris-production-backups"
r2_bucket_wal="medveris-production-wal"

# Monitoring configuration
prometheus_node_exporter="enabled"
grafana_dashboard="enabled"
health_check_interval="30s"

# NOTE: k3s, containerd, Helm, and trusted_ssh_cidrs list removed.
# k3s/containerd/Helm are not in scope (Docker Compose is approved).
# trusted_ssh_cidrs as a list is not supported in inventory key=value format.
# NOTE: deploy user lacks passwordless sudo — Ansible become will fail until fixed.
