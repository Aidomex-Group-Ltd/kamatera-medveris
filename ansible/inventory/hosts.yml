# Ansible Inventory for Medveris Kamatera Server
#
# STATUS: Phase 0 baseline verified 2026-11-07.
# - VPS at 113.30.188.181 is Ubuntu 26.04.1 LTS with PostgreSQL 18.6
# - deploy user has sudo but NOT passwordless sudo
# - UFW is enabled; inbound posture for this stage is SSH-only by default
# - Docker, k3s, Helm, Nginx, Ollama, n8n NOT installed in this repo stage
#
# Notes:
# - This is a YAML inventory. Do not mix INI-style [group:vars] sections into it.
# - The working SSH key is ~/.ssh/medveris_kamatera, not id_ed25519.
# - PostgreSQL 18.6 is already installed and running. Do NOT reinstall or
#   recreate the cluster.
# - pg_hba.conf and full UFW rule sets could not be read without sudo in this
#   session; verify them directly with the host administrator.

all:
  hosts:
    kamatera-1:
      ansible_host: 113.30.188.181
      ansible_user: deploy
  vars:
    ansible_ssh_private_key_file: ~/.ssh/medveris_kamatera
    ansible_ssh_common_args: "-o ServerAliveInterval=60 -o ServerAliveCountMax=3"
    postgres_version: "18"
    postgres_data_dir: "/var/lib/postgresql/18/main"
    postgres_listen_addresses: "localhost"
    postgres_max_connections: "100"
    postgres_shared_buffers: "128MB"
    postgres_work_mem: "16MB"
    postgres_maintenance_work_mem: "64MB"
    ufw_default_allow_ssh: "yes"
    postgres_max_memory: "1536m"
    ollama_memory_limit: "1024m"
    n8n_memory_limit: "512m"
    prometheus_node_exporter: "enabled"
    grafana_dashboard: "enabled"
    health_check_interval: "30s"

# Production host group for clarity.
production:
  hosts:
    kamatera-1:

# ---------------------------------------------------------------------------
# Sensitive items are intentionally not stored in this file.
# ---------------------------------------------------------------------------
# Cloudflare account identifiers belong in the project secret store, not here.
#   cloudflare_account_id: <set in secret store>
#
# R2 bucket names are operational secrets/config and should be rendered from
# the appropriate config/secret management, not from inventory.
#   r2_bucket_backups: <set in secret store>
#   r2_bucket_wal: <set in secret store>
#
# trusted_ssh_cidrs is intentionally omitted until it is verified and stored in
# a proper configuration/secret location.
#
# k3s, containerd, and Helm are not part of this stage.
