# Medveris supporting services deployment workflow
#
# Trigger:
#  - workflow_dispatch only (initial operational control plane)
#  - Runs only on the protected main branch
#  - Runs only on the self-hosted Kamatera runner
#
# Security posture:
#  - Least-privilege GitHub token permissions
#  - No secrets printed or transferred through logs
#  - No arbitrary commands or arbitrary deploy paths
#  - Validate before deploy, verify after deploy, rollback without volume loss
#
# This workflow deploys the Docker Compose release to /opt/medveris/compose/.
# It does not install Docker, modify firewall/SSH/PostgreSQL, or change host
# network policy. Those are separate, authenticated administrative actions.

name: deploy-supporting-services

on:
  workflow_dispatch:
    inputs:
      confirm_deploy:
        description: "Type CONFIRM to proceed with deployment to main."
        required: true
        type: string
      action:
        description: "Deployment action."
        required: true
        type: choice
        options:
          - deploy
          - status
          - verify
          - rollback
        default: "deploy"

permissions:
  contents: read
  actions: none
  deployments: none
  packages: none
  security-events: none
  statuses: none

concurrency:
  group: medveris-supporting-services
  cancel-in-progress: false

jobs:
  validate:
    name: validate-repo
    runs-on: [self-hosted, kamatera]
    if: |
      github.ref == 'refs/heads/main' &&
      (inputs.action == 'deploy' || inputs.action == 'status' ||
       inputs.action == 'verify' || inputs.action == 'rollback') &&
      inputs.confirm_deploy == 'CONFIRM'
    steps:
      - name: checkout main
        uses: actions/checkout@v4

      - name: validate workflow inputs
        run: |
          echo "Branch: ${GITHUB_REF}"
          echo "Runner: ${RUNNER_NAME:-}"
          echo "Action: ${INPUT_ACTION}"
          echo "Deployment target: /opt/medveris/compose"

      - name: validate compose file syntax
        run: |
          COMPOSE_FILE="$(pwd)/docker/compose.yml"
          if [ ! -f "$COMPOSE_FILE" ]; then
            echo "::error::compose file not found at $COMPOSE_FILE"
            exit 1
          fi
          # Validate structure without assuming Docker is installed on the runner,
          # but prefer docker compose if available.
          if command -v docker >/dev/null 2>&1 && docker compose version >/dev/null 2>&1; then
            docker compose -f "$COMPOSE_FILE" config --quiet
          else
            echo "::warning::docker compose unavailable in this environment; skipping live config validation"
          fi

      - name: validate no published public ports
        run: |
          COMPOSE_FILE="$(pwd)/docker/compose.yml"
          if [ -f "$COMPOSE_FILE" ]; then
            if grep -nE '"0\.0\.0\.0:' "$COMPOSE_FILE" >/dev/null; then
              echo "::error::compose file publishes a port on 0.0.0.0. This is not allowed."
              exit 1
            fi
          fi

      - name: validate no latest tags
        run: |
          if [ -f docker/compose.yml ]; then
            if grep -nE ':latest' docker/compose.yml >/dev/null; then
              echo "::error::compose file uses :latest tags. Pin all images."
              exit 1
            fi
          fi

  validate-images:
    name: validate-images
    runs-on: [self-hosted, kamatera]
    if: |
      github.ref == 'refs/heads/main' &&
      (inputs.action == 'deploy' || inputs.action == 'status' ||
       inputs.action == 'verify' || inputs.action == 'rollback') &&
      inputs.confirm_deploy == 'CONFIRM'
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - name: checkout main
        uses: actions/checkout@v4

      - name: detect compose image changes
        id: check
        run: |
          COMPOSE_FILE="$(pwd)/docker/compose.yml"
          POLICY_DOC="$(pwd)/.github/workflows/pin-policy.md"
          POLICY_JSON="$(pwd)/.github/workflows/pin-policy.json"
          if [ ! -f "$COMPOSE_FILE" ]; then
            echo "::error::compose file not found at $COMPOSE_FILE"
            exit 1
          fi
          if [ ! -f "$POLICY_DOC" ]; then
            echo "::error::image pin policy doc not found at $POLICY_DOC"
            exit 1
          fi
          if [ ! -f "$POLICY_JSON" ]; then
            echo "::error::image pin policy JSON not found at $POLICY_JSON"
            exit 1
          fi
          echo "checking image references in $COMPOSE_FILE"
          python3 - <<'PY'
          import re, sys, json
          compose = open("docker/compose.yml", "r", encoding="utf-8").read()
          policy = json.load(open(".github/workflows/pin-policy.json", "r", encoding="utf-8"))
          images = re.findall(r"image:\s*([^\s]+)", compose)
          if not images:
              print("::warning::no image references found in compose file")
              print("changed=false")
              sys.exit(0)
          allowed_registries = policy.get("allowed_registries", [])
          allowed_image_prefixes = policy.get("allowed_image_prefixes", [])
          allowed_tag_patterns = policy.get("allowed_tag_patterns", [])
          problems = []
          for image in images:
              if ":" not in image:
                  problems.append(f"unpinned image without tag: {image}")
                  continue
              raw = image
              registry_part = ""
              image_name = raw
              if raw.startswith("docker.io/"):
                  image_name = raw[len("docker.io/"):]
              if "/" in image_name:
                  candidate, after_slash = image_name.split("/", 1)
                  if candidate == "docker.io":
                      registry_part = ""
                      image_name = after_slash
                  elif re.search(r"\.|localhost", candidate):
                      registry_part = candidate
                      image_name = after_slash
                  else:
                      registry_part = ""
              if registry_part and registry_part not in allowed_registries:
                  problems.append(f"disallowed registry: {image}")
                  continue
              image_name = image_name.split("@", 1)[0]
              if ":" not in image_name:
                  problems.append(f"unpinned image reference: {image}")
                  continue
              name, tag = image_name.rsplit(":", 1)
              if tag == "latest":
                  problems.append(f"latest tag: {image}")
                  continue
              if not any(re.search(pattern, tag) for pattern in allowed_tag_patterns):
                  problems.append(f"tag does not match allowed patterns: {image}")
                  continue
              if not any(image_name.startswith(prefix) for prefix in allowed_image_prefixes):
                  problems.append(f"image name does not match an allowed prefix: {image_name}")
                  continue
          if problems:
              for p in problems:
                  print(f"::error::{p}")
              print("changed=true")
              sys.exit(1)
          print("changed=false")
          PY
        env:
          PYTHONPATH: "${{ github.workspace }}/.github/workflows"

      - name: validate image policy
        run: |
          python3 - <<'PY'
          import json, sys
          policy = json.load(open(".github/workflows/pin-policy.json", "r", encoding="utf-8"))
          if not policy.get("allowed_registries"):
              print("::error::pin policy must declare allowed_registries")
              sys.exit(1)
          if not policy.get("allowed_image_prefixes"):
              print("::error::pin policy must declare allowed_image_prefixes")
              sys.exit(1)
          if not policy.get("allowed_tag_patterns"):
              print("::error::pin policy must declare allowed_tag_patterns")
              sys.exit(1)
          print("image pin policy loaded and valid")
          PY

  deploy:
    name: deploy-compose
    runs-on: [self-hosted, kamatera]
    needs: [validate, validate-images]
    if: |
      github.ref == 'refs/heads/main' &&
      inputs.action == 'deploy' && inputs.confirm_deploy == 'CONFIRM'
    environment:
      name: medveris-supporting-services
    steps:
      - name: checkout main
        uses: actions/checkout@v4

      - name: deploy supporting services
        env:
          DEPLOY_DIR: /opt/medveris/compose
        run: |
          scripts/deploy-compose.sh "$DEPLOY_DIR"

      - name: verify deployment
        env:
          DEPLOY_DIR: /opt/medveris/compose
        run: |
          scripts/verify-services.sh "$DEPLOY_DIR"

  status:
    name: status
    runs-on: [self-hosted, kamatera]
    needs: [validate, validate-images]
    if: |
      github.ref == 'refs/heads/main' &&
      inputs.action == 'status' && inputs.confirm_deploy == 'CONFIRM'
    steps:
      - name: report compose status
        env:
          DEPLOY_DIR: /opt/medveris/compose
        run: |
          scripts/deploy-compose.sh status "$DEPLOY_DIR"

  verify:
    name: verify-only
    runs-on: [self-hosted, kamatera]
    needs: [validate, validate-images]
    if: |
      github.ref == 'refs/heads/main' &&
      inputs.action == 'verify' && inputs.confirm_deploy == 'CONFIRM'
    steps:
      - name: verify deployed services
        env:
          DEPLOY_DIR: /opt/medveris/compose
        run: |
          scripts/verify-services.sh "$DEPLOY_DIR"

  rollback:
    name: rollback
    runs-on: [self-hosted, kamatera]
    needs: [validate, validate-images]
    if: |
      github.ref == 'refs/heads/main' &&
      inputs.action == 'rollback' && inputs.confirm_deploy == 'CONFIRM'
    environment:
      name: medveris-supporting-services
    steps:
      - name: rollback supporting services
        env:
          DEPLOY_DIR: /opt/medveris/compose
        run: |
          scripts/rollback-compose.sh "$DEPLOY_DIR"
